<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="sleepbg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#1F2A3A"/>
      <stop offset="100%" stop-color="#0E141B"/>
    </linearGradient>
    <radialGradient id="moon" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#F2EBE0"/>
      <stop offset="50%" stop-color="#C9B8A0"/>
      <stop offset="100%" stop-color="#4A4A36"/>
    </radialGradient>
    <radialGradient id="moonShadow" cx="65%" cy="65%" r="60%">
      <stop offset="40%" stop-color="rgba(14,20,27,0)"/>
      <stop offset="70%" stop-color="rgba(14,20,27,0.9)"/>
    </radialGradient>
    <filter id="moonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#sleepbg)"/>

  <!-- stars -->
  <g fill="#E8DDCB">
    <circle cx="120" cy="160" r="1" opacity="0.9"/>
    <circle cx="340" cy="80" r="1.4" opacity="0.7"/>
    <circle cx="520" cy="220" r="1" opacity="0.6"/>
    <circle cx="780" cy="120" r="1.6" opacity="0.85"/>
    <circle cx="980" cy="60" r="1" opacity="0.5"/>
    <circle cx="1200" cy="180" r="1.2" opacity="0.8"/>
    <circle cx="1440" cy="100" r="1" opacity="0.6"/>
    <circle cx="220" cy="340" r="1" opacity="0.5"/>
    <circle cx="600" cy="380" r="1.4" opacity="0.7"/>
    <circle cx="1380" cy="320" r="1" opacity="0.6"/>
    <circle cx="80" cy="540" r="1.2" opacity="0.7"/>
    <circle cx="1480" cy="640" r="1" opacity="0.5"/>
    <circle cx="320" cy="780" r="1" opacity="0.4"/>
    <circle cx="1180" cy="860" r="1.2" opacity="0.6"/>
  </g>

  <!-- text -->
  <g transform="translate(130, 280)" fill="#E8DDCB">
    <text font-size="11" letter-spacing="3" opacity="0.6">CHAPTER 01 · SLEEP</text>
    <text y="120" font-family="Fraunces, Georgia, serif" font-weight="300" font-size="86" letter-spacing="-2">The first place</text>
    <text y="220" font-family="Fraunces, Georgia, serif" font-weight="300" font-size="86" letter-spacing="-2"><tspan font-style="italic" fill="#B8704A">healing</tspan> happens.</text>
    <text y="320" font-size="18" opacity="0.85">
      <tspan x="0">Eight hours is a number. <tspan font-family="Fraunces, Georgia, serif" font-style="italic" fill="#B8704A">Restoration</tspan> is a state.</tspan>
      <tspan x="0" dy="28">Ōura measures the gap between them — REM, deep, the</tspan>
      <tspan x="0" dy="28">architecture of your night — and tells you what to change</tspan>
      <tspan x="0" dy="28">before you feel it.</tspan>
    </text>
  </g>

  <!-- moon -->
  <g transform="translate(1200, 500)">
    <circle r="280" fill="#E8DDCB" opacity="0.05" filter="url(#moonGlow)"/>
    <circle r="240" fill="url(#moon)"/>
    <circle r="240" fill="url(#moonShadow)"/>
    <!-- craters -->
    <circle cx="-80" cy="-60" r="22" fill="rgba(74,74,54,0.25)"/>
    <circle cx="40" cy="-110" r="14" fill="rgba(74,74,54,0.3)"/>
    <circle cx="-50" cy="80" r="18" fill="rgba(74,74,54,0.2)"/>
    <circle cx="90" cy="40" r="10" fill="rgba(74,74,54,0.35)"/>
  </g>

  <!-- bottom rule + sleep stages -->
  <g transform="translate(130, 860)" fill="#E8DDCB">
    <text font-size="11" letter-spacing="3" opacity="0.5">SLEEP STAGES — LAST NIGHT</text>
    <g transform="translate(0, 30)">
      <rect width="180" height="14" fill="#B8704A" opacity="0.85"/>
      <rect x="180" width="280" height="14" fill="#4A4A36"/>
      <rect x="460" width="160" height="14" fill="#B8704A" opacity="0.6"/>
      <rect x="620" width="240" height="14" fill="#4A4A36" opacity="0.7"/>
      <rect x="860" width="200" height="14" fill="#B8704A" opacity="0.5"/>
      <rect x="1060" width="280" height="14" fill="#4A4A36" opacity="0.6"/>
    </g>
    <g transform="translate(0, 70)" font-size="11" letter-spacing="2" opacity="0.6">
      <text>DEEP 1H 42M</text>
      <text x="300">REM 1H 58M</text>
      <text x="620">LIGHT 4H 12M</text>
      <text x="980">AWAKE 14M</text>
    </g>
  </g>
</svg>
